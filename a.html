<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Dates & Info</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h2>Upcoming Dates & Important Info</h2>
            <p><strong>Registration Deadline:</strong> [Date]</p>
            <p><strong>Event Dates:</strong> [Date(s)]</p>
            <p><strong>Results Announcement:</strong> [Date]</p>
            <button class="register-btn">Register Before It's Too Late!</button>
        </div>
        <div class="images">
            <img src="girl.png" alt="Girl" class="girl">
            <img src="boy.png" alt="Boy" class="boy">
        </div>
    </div>
</body>
</html>
